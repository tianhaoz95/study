<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Subscribe to get notified when new AI/ML deep dives drop. No noise — just the signal." />
    <title>Subscribe — HEJI DEV</title>
    <script>
      (function(){var t=localStorage.getItem('heji-theme')||'dark';document.documentElement.dataset.theme=t;})();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Ambient background -->
    <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-2" aria-hidden="true"></div>

    <!-- Nav -->
    <nav class="site-nav">
      <a class="nav-brand" id="nav-home" href="#">HEJI DEV</a>
      <div class="nav-actions">
        <a class="nav-link" id="nav-blog" href="#" data-i18n="nav-blog">Blog</a>
        <button class="btn-icon" id="theme-toggle" aria-label="Toggle theme">
          <svg id="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg id="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="btn-icon" id="lang-toggle" aria-label="Toggle language">中</button>
      </div>
    </nav>

    <!-- Main content: subscription card -->
    <main class="main">
      <!-- Default: sign-up form -->
      <div class="card" id="card-signup">
        <div class="card-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <h1 class="card-title" data-i18n="card-title">Stay in the loop</h1>
        <p class="card-sub">
          <span data-i18n="card-sub-1">Get notified when new AI/ML deep dives drop.</span><br />
          <span data-i18n="card-sub-2">No noise — just the signal.</span>
        </p>

        <!-- Email form -->
        <form id="email-form" novalidate>
          <div class="field-group">
            <input
              class="field-input"
              id="email-input"
              type="email"
              placeholder="you@example.com"
              data-i18n-placeholder="email-placeholder"
              autocomplete="email"
              spellcheck="false"
            />
            <button class="btn-submit" id="btn-submit" type="submit">
              <span data-i18n="btn-submit">Subscribe</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
          <p class="field-error" id="field-error" hidden></p>
        </form>

        <p class="card-legal" data-i18n="card-legal">No spam, ever. Unsubscribe at any time.</p>
      </div>

      <!-- Loading state -->
      <div class="card card-centered" id="card-loading" hidden>
        <div class="spinner" aria-label="Subscribing…">
          <div class="spinner-ring"></div>
        </div>
        <p class="card-sub" id="loading-label">Subscribing…</p>
      </div>

      <!-- Success state -->
      <div class="card card-centered" id="card-success" hidden>
        <div class="success-icon" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h2 class="card-title" data-i18n="success-title">You're in!</h2>
        <p class="card-sub" data-i18n="success-msg">You'll hear from me when the next deep dive drops.</p>
        <div class="success-email" id="success-email"></div>
        <a class="btn-text" id="success-blog" href="#" data-i18n="success-blog">Read the latest post →</a>
      </div>

    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
