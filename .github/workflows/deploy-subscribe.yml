name: Deploy Subscribe

on:
  push:
    branches:
      - main
    paths:
      - 'apps/subscribe/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-subscribe.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/subscribe/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/subscribe

      - name: Build
        run: npm run build
        working-directory: apps/subscribe
        env:
          VITE_HOME_URL: https://heji-study.web.app
          VITE_BLOG_URL: https://heji-study-blog.web.app

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting:heji-study-subscribe --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
