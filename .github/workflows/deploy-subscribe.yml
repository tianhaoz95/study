name: Deploy Subscribe

on:
  push:
    branches:
      - main
    paths:
      - 'apps/subscribe/**'
      - 'apps/blog/src/pages/index.astro'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-subscribe.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  deployments: write

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ github.token }}
          env: subscribe

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/subscribe/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/subscribe

      - name: Build
        run: npm run build
        working-directory: apps/subscribe
        env:
          VITE_HOME_URL: https://heji-study.web.app
          VITE_BLOG_URL: https://heji-study-blog.web.app

      - name: Authenticate to Firebase
        run: echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$RUNNER_TEMP/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: |
          set -o pipefail
          if npx firebase-tools@latest deploy --only hosting:heji-study-subscribe --project heji-study 2>&1 | tee "$RUNNER_TEMP/deploy.log"; then
            exit 0
          elif grep -q "is the current active version" "$RUNNER_TEMP/deploy.log"; then
            echo "No content changes — site already at this version; treating as success."
            exit 0
          else
            exit 1
          fi
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json

      - name: Update deployment status
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ github.token }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env_url: https://heji-study-subscribe.web.app
