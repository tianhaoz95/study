name: Deploy Blog

on:
  push:
    branches:
      - main
    paths:
      - 'apps/blog/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-blog.yml'

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/blog/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/blog

      - name: Build
        run: npm run build
        working-directory: apps/blog

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting:heji-study-blog --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
